services:
  brevet-service:
    build: ./laptop
    volumes:
      - ./laptop:/brevets
    ports:
      - "5001:5000"
    environment:
      - DB_PORT_27017_TCP_ADDR=db
    depends_on:
      - db

  website:
    image: php:apache  
    volumes:
      - ./website:/var/www/html 
    ports:
      - 5000:80  # host:container
    depends_on:
      - brevet-service  # website is not going to work unless laptop-service is running
  db:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: